<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"
     role="img" aria-label="Radiocommande RC à poignée pistolet vue de trois quarts arrière : volant de direction à gauche, gâchette des gaz sur la poignée, écran central, molettes de trim et de dual rate, limiteur de puissance, inverseur, boutons CH3 et CH4, interrupteur et témoin lumineux">
  <defs>
    <linearGradient id="shell" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0%" stop-color="#565d67"/>
      <stop offset="34%" stop-color="#383e47"/>
      <stop offset="100%" stop-color="#1b1f25"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="grip" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#3f454f"/>
      <stop offset="55%" stop-color="#252a31"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0%" stop-color="#cfe4dd"/>
      <stop offset="48%" stop-color="#a9c8bf"/>
      <stop offset="100%" stop-color="#87aaa1"/>
    </linearGradient>
    <linearGradient id="dial" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#767e89"/>
      <stop offset="52%" stop-color="#434a54"/>
      <stop offset="100%" stop-color="#242830"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="46%" stop-color="#9ba4af"/>
      <stop offset="100%" stop-color="#5a626d"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5158"/>
      <stop offset="38%" stop-color="#2a2f36"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#8effae"/>
      <stop offset="55%" stop-color="#27a94c"/>
      <stop offset="100%" stop-color="#0c3a1a"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <style>
      .lbl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#aab2bd;letter-spacing:1px}
      .lbl-s{font-size:14px}
      .lbl-xs{font-size:11.5px;fill:#8b939e}
      .lcdtxt{font-family:'IBM Plex Mono',ui-monospace,monospace;fill:#2c3a35}
    </style>
  </defs>

  <!-- antenne courte -->
  <g filter="url(#drop)">
    <rect x="292" y="26" width="17" height="76" rx="8.5" fill="url(#foam)"/>
    <rect x="297" y="34" width="4" height="56" rx="2" fill="#6d757f" opacity=".55"/>
  </g>

  <!-- poignée pistolet -->
  <g filter="url(#drop)">
    <path d="M372 330
             C348 380 336 436 342 496
             C346 552 372 588 416 594
             C462 600 500 572 516 522
             C532 472 540 402 536 336 Z"
          fill="url(#grip)"/>
    <path d="M372 330 C352 378 342 432 348 490 C352 540 374 574 412 580"
          fill="none" stroke="#7b838e" stroke-width="3" stroke-opacity=".3"/>
    <!-- stries antidérapantes -->
    <g stroke="#0e1116" stroke-width="3" opacity=".55">
      <path d="M362 402 q34 10 66 6"/>
      <path d="M356 432 q36 11 70 6"/>
      <path d="M353 462 q36 11 72 6"/>
      <path d="M355 492 q36 10 70 5"/>
      <path d="M362 522 q34 9 66 4"/>
    </g>
  </g>

  <!-- corps de la radio -->
  <g filter="url(#drop)">
    <path d="M262 128
             C262 104 282 92 306 92
             L648 92
             C674 92 692 108 692 134
             L692 316
             C692 344 672 360 646 360
             L392 360
             C348 360 322 344 300 312
             L268 214 Z"
          fill="url(#shell)"/>
    <path d="M262 128
             C262 104 282 92 306 92
             L648 92
             C674 92 692 108 692 134
             L692 316
             C692 344 672 360 646 360
             L392 360
             C348 360 322 344 300 312
             L268 214 Z"
          fill="url(#gloss)"/>
    <path d="M276 134 C276 116 292 106 310 106 L644 106 C664 106 678 118 678 136"
          fill="none" stroke="#828b96" stroke-width="2" stroke-opacity=".4"/>
  </g>

  <!-- bras de fixation du volant -->
  <path d="M262 196 L206 210 L206 292 L268 300 Z" fill="#22262d"/>
  <path d="M262 196 L206 210" stroke="#6f7883" stroke-width="2" stroke-opacity=".35" fill="none"/>

  <!-- ============ VOLANT (1) ============ -->
  <g>
    <ellipse cx="170" cy="256" rx="70" ry="112" fill="#0f1216" opacity=".45"
             transform="translate(4,8)"/>
    <ellipse cx="166" cy="250" rx="66" ry="108" fill="none" stroke="url(#foam)" stroke-width="26"/>
    <ellipse cx="166" cy="250" rx="66" ry="108" fill="none" stroke="#767f8a" stroke-width="1.6" stroke-opacity=".35"/>
    <ellipse cx="166" cy="250" rx="53" ry="95" fill="none" stroke="#0d1014" stroke-width="2" stroke-opacity=".6"/>
    <!-- branches -->
    <g fill="url(#dial)" stroke="#12161b" stroke-width="1.4">
      <path d="M160 152 l16 0 l7 90 l-30 0 z"/>
      <path d="M126 316 l-10 -16 l52 -42 l16 22 z"/>
      <path d="M206 316 l10 -16 l-52 -42 l-16 22 z"/>
    </g>
    <ellipse cx="166" cy="250" rx="27" ry="30" fill="url(#dial)" stroke="#0e1116" stroke-width="2"/>
    <ellipse cx="157" cy="238" rx="9" ry="10" fill="#fff" opacity=".13"/>
    <!-- mousse de préhension -->
    <g stroke="#0d1014" stroke-width="2" opacity=".5">
      <path d="M104 208 l-10 -4"/><path d="M100 250 l-12 0"/><path d="M104 292 l-10 4"/>
    </g>
  </g>

  <!-- ============ GÂCHETTE (2) ============ -->
  <g>
    <path d="M352 352
             C324 360 306 384 302 414
             C298 446 310 474 330 486
             C346 496 360 488 362 470
             C365 440 366 400 372 366 Z"
          fill="url(#dial)" stroke="#0f1216" stroke-width="3"/>
    <path d="M348 366 C328 376 316 396 312 418"
          fill="none" stroke="#ccd4dd" stroke-width="3" stroke-opacity=".28"/>
    <circle cx="366" cy="356" r="11" fill="#12151a"/>
    <circle cx="366" cy="356" r="4.5" fill="url(#chrome)"/>
    <!-- repères de course -->
    <g class="lbl lbl-xs">
      <text x="196" y="416">GAZ</text>
      <text x="182" y="470">NEUTRE</text>
      <text x="196" y="524">FREIN</text>
    </g>
    <g stroke="#79818c" stroke-width="1.5" opacity=".5">
      <path d="M236 410 l52 8"/><path d="M240 464 l58 2"/><path d="M236 518 l50 -14"/>
    </g>
  </g>

  <!-- ============ ÉCRAN ============ -->
  <g>
    <rect x="352" y="140" width="238" height="112" rx="12" fill="#161a20" filter="url(#inset)"/>
    <rect x="360" y="148" width="222" height="96" rx="7" fill="url(#lcd)"/>
    <g class="lcdtxt">
      <text x="374" y="184" font-size="30" font-weight="700" letter-spacing="2">TH 50%</text>
      <text x="374" y="214" font-size="17" letter-spacing="1.5">ST-D/R 80</text>
      <text x="374" y="234" font-size="13" letter-spacing="1.2" opacity=".8">MODEL 01 · 2.4G</text>
      <rect x="500" y="196" width="66" height="12" rx="3" fill="#2c3a35" opacity=".22"/>
      <rect x="500" y="196" width="40" height="12" rx="3" fill="#2c3a35" opacity=".55"/>
      <text x="500" y="228" font-size="11" letter-spacing="1">BATT</text>
    </g>
  </g>

  <!-- ============ TH.LIM, limiteur 3 positions (7) ============ -->
  <g>
    <rect x="278" y="108" width="34" height="86" rx="12" fill="#0f1216"/>
    <rect x="284" y="114" width="22" height="24" rx="7" fill="url(#chrome)"/>
    <g stroke="#5f6771" stroke-width="1.5">
      <path d="M282 146 l26 0"/><path d="M282 174 l26 0"/>
    </g>
    <text class="lbl lbl-xs" x="295" y="208" text-anchor="middle">TH.LIM</text>
    <text class="lbl lbl-xs" x="295" y="104" text-anchor="middle">20/50/100</text>
  </g>

  <!-- ============ ST-REV, inverseur (8) ============ -->
  <g>
    <rect x="628" y="112" width="46" height="30" rx="10" fill="#0f1216"/>
    <rect x="654" y="117" width="16" height="20" rx="6" fill="url(#chrome)"/>
    <text class="lbl lbl-xs" x="651" y="160" text-anchor="middle">ST-REV</text>
  </g>

  <!-- ============ CH3 et CH4 (9) ============ -->
  <g>
    <rect x="626" y="196" width="50" height="30" rx="9" fill="#0f1216"/>
    <rect x="631" y="201" width="40" height="20" rx="6" fill="url(#dial)"/>
    <text class="lbl lbl-xs" x="651" y="242" text-anchor="middle">CH3</text>
    <rect x="626" y="250" width="50" height="30" rx="9" fill="#0f1216"/>
    <rect x="631" y="255" width="40" height="20" rx="6" fill="url(#dial)"/>
    <text class="lbl lbl-xs" x="651" y="296" text-anchor="middle">CH4</text>
  </g>

  <!-- ============ TÉMOIN LUMINEUX (11) ============ -->
  <g>
    <circle cx="330" cy="238" r="14" fill="#0d1014"/>
    <circle cx="330" cy="238" r="9.5" fill="url(#ledGlow)"/>
    <circle cx="327" cy="234" r="3.2" fill="#fff" opacity=".7"/>
  </g>

  <!-- ============ MOLETTES : trims et dual rate (3,4,5,6) ============ -->
  <g>
    <!-- ST-D/R -->
    <circle cx="382" cy="298" r="26" fill="#0f1216"/>
    <circle cx="382" cy="298" r="21" fill="url(#dial)"/>
    <path d="M382 285 l0 -6" stroke="#e9eef4" stroke-width="2.5"/>
    <circle cx="382" cy="298" r="6" fill="#12161b"/>
    <text class="lbl lbl-xs" x="382" y="340" text-anchor="middle">ST-D/R</text>
    <!-- ST-TRM -->
    <circle cx="452" cy="298" r="26" fill="#0f1216"/>
    <circle cx="452" cy="298" r="21" fill="url(#dial)"/>
    <path d="M452 285 l0 -6" stroke="#e9eef4" stroke-width="2.5"/>
    <circle cx="452" cy="298" r="6" fill="#12161b"/>
    <text class="lbl lbl-xs" x="452" y="340" text-anchor="middle">ST-TRM</text>
    <!-- TH-TRM -->
    <circle cx="522" cy="298" r="26" fill="#0f1216"/>
    <circle cx="522" cy="298" r="21" fill="url(#dial)"/>
    <path d="M522 285 l0 -6" stroke="#e9eef4" stroke-width="2.5"/>
    <circle cx="522" cy="298" r="6" fill="#12161b"/>
    <text class="lbl lbl-xs" x="522" y="340" text-anchor="middle">TH-TRM</text>
    <!-- TH-D/R -->
    <circle cx="592" cy="298" r="26" fill="#0f1216"/>
    <circle cx="592" cy="298" r="21" fill="url(#dial)"/>
    <path d="M592 285 l0 -6" stroke="#e9eef4" stroke-width="2.5"/>
    <circle cx="592" cy="298" r="6" fill="#12161b"/>
    <text class="lbl lbl-xs" x="592" y="340" text-anchor="middle">TH-D/R</text>
  </g>

  <!-- ============ INTERRUPTEUR (10) ============ -->
  <g>
    <rect x="608" y="322" width="80" height="28" rx="9" fill="#0f1216"/>
    <rect x="613" y="327" width="32" height="18" rx="6" fill="url(#chrome)"/>
    <text class="lbl lbl-xs" x="700" y="342">ON · OFF</text>
  </g>

  <text class="lbl lbl-xs" x="450" y="602" text-anchor="middle" fill="#79818c">
    RADIOCOMMANDE 2,4 GHZ À VOLANT · 3 VOIES
  </text>
</svg>
